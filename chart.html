
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f1f1f1">
  <title>Monthly Record Chart</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f1f1f1;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      background: #30c69a;
      color: white;
      text-align: center;
      padding: 18px 8px;
    }

    header h1 {
      font-size: clamp(23px, 5vw, 32px);
      margin: 0 0 8px;
    }

    header p { margin: 0; font-size: 15px; }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 14px 8px 35px;
    }

    .back {
      display: inline-block;
      margin-bottom: 14px;
      color: #456fb5;
      text-decoration: none;
      font-size: 16px;
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    select, button {
      min-width: 0;
      padding: 11px;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 0;
      background: white;
    }

    select { flex: 1; }

    button {
      background: #ffc400;
      border: none;
      color: #222;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; cursor: wait; }

    .chart-title {
      background: #3b3b3b;
      color: white;
      padding: 12px 8px;
      text-align: center;
      font-size: 20px;
      line-height: 1.4;
    }

    .status {
      padding: 10px;
      background: white;
      color: #555;
      font-size: 14px;
    }

    .table-wrap { overflow-x: auto; background: white; }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 570px;
      background: white;
    }

    th {
      background: #3b3b3b;
      color: white;
      font-weight: normal;
      padding: 11px 8px;
      border: 1px solid #555;
    }

    td {
      padding: 10px 8px;
      border: 1px solid #ddd;
      text-align: center;
      font-size: 16px;
    }

    td:first-child {
      font-weight: bold;
      background: #f8f8f8;
    }

    .note {
      margin-top: 16px;
      padding: 12px;
      background: white;
      border: 1px solid #ddd;
      color: #555;
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 420px) {
      .filters { gap: 6px; }
      select, button { padding: 10px 7px; font-size: 14px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>Monthly Record Chart</h1>
    <p>Historical Results Chart</p>
  </header>

  <main class="container">
    <a class="back" href="index.html">← Back to Results</a>

    <div class="filters">
      <select id="month" aria-label="Select month">
        <option value="0">January</option>
        <option value="1">February</option>
        <option value="2">March</option>
        <option value="3">April</option>
        <option value="4">May</option>
        <option value="5">June</option>
        <option value="6">July</option>
        <option value="7">August</option>
        <option value="8">September</option>
        <option value="9">October</option>
        <option value="10">November</option>
        <option value="11">December</option>
      </select>

      <select id="year" aria-label="Select year"></select>
      <button id="showChart" type="button">Show</button>
    </div>

    <div class="chart-title" id="chartTitle"></div>
    <div class="status" id="status" role="status">Loading results...</div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Desawar</th>
            <th>Shri Ganesh</th>
            <th>Faridabad</th>
            <th>Ghaziabad</th>
          </tr>
        </thead>
        <tbody id="chartBody"></tbody>
      </table>
    </div>

    <div class="note">
      <strong>Note:</strong> Results are shown from the connected database.
      Dates without saved results display "--". Please verify information
      before publishing it.
    </div>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import {
      getFirestore, collection, getDocs, query, orderBy
    } from
      "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBzbbDq388GcoGyFVE-EmZk3flKgT13tZw",
      authDomain: "satta-result-4a7a5.firebaseapp.com",
      projectId: "satta-result-4a7a5",
      storageBucket: "satta-result-4a7a5.firebasestorage.app",
      messagingSenderId: "264282820868",
      appId: "1:264282820868:web:c39a794e65c5be0e7c0051"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const monthSelect = document.getElementById("month");
    const yearSelect = document.getElementById("year");
    const chartBody = document.getElementById("chartBody");
    const chartTitle = document.getElementById("chartTitle");
    const status = document.getElementById("status");
    const showButton = document.getElementById("showChart");

    const monthNames = [
      "January", "February", "March", "April",
      "May", "June", "July", "August",
      "September", "October", "November", "December"
    ];

    const currentYear = new Date().getFullYear();

    for (let year = currentYear - 5; year <= currentYear + 2; year++) {
      const option = document.createElement("option");
      option.value = year;
      option.textContent = year;
      if (year === currentYear) option.selected = true;
      yearSelect.appendChild(option);
    }

    monthSelect.value = String(new Date().getMonth());

    let savedResults = [];

    function normalizeMarket(value) {
      return String(value || "").trim().toLowerCase();
    }

    function getResultForMarket(record, marketName) {
      // Supports the field names used by the current admin form.
      if (normalizeMarket(record.market) === normalizeMarket(marketName)) {
        return record.result;
      }

      // Also supports a document containing separate market fields.
      const directValue = Object.entries(record).find(
        ([key]) => normalizeMarket(key) === normalizeMarket(marketName)
      );

      return directValue ? directValue[1] : "--";
    }

    function formatResult(value) {
      if (value === undefined || value === null || value === "") {
        return "--";
      }
      return String(value);
    }

    function renderChart() {
      const month = Number(monthSelect.value);
      const year = Number(yearSelect.value);
      const days = new Date(year, month + 1, 0).getDate();

      chartTitle.textContent =
        monthNames[month] + " " + year + " Monthly Chart";

      chartBody.replaceChildren();

      const monthlyRecords = savedResults.filter(record => {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(String(record.date || ""))) {
          return false;
        }

        const [recordYear, recordMonth] = record.date.split("-").map(Number);
        return recordYear === year && recordMonth === month + 1;
      });

      const recordsByDate = new Map();

      monthlyRecords.forEach(record => {
        // If multiple records exist for the same date and market,
        // the latest record returned by the date-sorted query wins.
        const key = record.date;
        if (!recordsByDate.has(key)) recordsByDate.set(key, []);
        recordsByDate.get(key).push(record);
      });

      for (let day = 1; day <= days; day++) {
        const date = [
          year,
          String(month + 1).padStart(2, "0"),
          String(day).padStart(2, "0")
        ].join("-");

        const row = document.createElement("tr");
        const dateCell = document.createElement("td");
        dateCell.textContent = String(day).padStart(2, "0");
        row.appendChild(dateCell);

        const records = recordsByDate.get(date) || [];
        const marketNames = [
          "Desawar",
          "Shri Ganesh",
          "Faridabad",
          "Ghaziabad"
        ];

        marketNames.forEach(marketName => {
          const cell = document.createElement("td");
          const matchingRecord = records.find(
            record => normalizeMarket(record.market) ===
              normalizeMarket(marketName)
          );

          cell.textContent = matchingRecord
            ? formatResult(matchingRecord.result)
            : "--";

          row.appendChild(cell);
        });

        chartBody.appendChild(row);
      }

      status.textContent = monthlyRecords.length
        ? `Loaded ${monthlyRecords.length} saved record(s) for ${monthNames[month]} ${year}.`
        : `No saved results found for ${monthNames[month]} ${year}.`;
    }

    async function loadResults() {
      showButton.disabled = true;
      status.textContent = "Loading results from Firebase...";

      try {
        const resultsQuery = query(
          collection(db, "results"),
          orderBy("date", "desc")
        );

        const snapshot = await getDocs(resultsQuery);

        savedResults = snapshot.docs.map(document => ({
          id: document.id,
          ...document.data()
        }));

        renderChart();
      } catch (error) {
        console.error("Firebase chart load error:", error);
        chartBody.replaceChildren();
        status.textContent =
          "Could not load Firebase results. Check your connection and Firestore rules, then try again.";
      } finally {
        showButton.disabled = false;
      }
    }

    showButton.addEventListener("click", renderChart);

    loadResults();
  </script>
</body>
</html>
