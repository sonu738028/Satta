
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f1f1f1">
  <title>Monthly Record Chart</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f1f1f1;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      background: #30c69a;
      color: white;
      text-align: center;
      padding: 18px 8px;
    }

    header h1 {
      font-size: clamp(23px, 5vw, 32px);
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
      font-size: 15px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 14px 8px 35px;
    }

    .back {
      display: inline-block;
      margin-bottom: 14px;
      color: #456fb5;
      text-decoration: none;
      font-size: 16px;
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    select, button {
      min-width: 0;
      padding: 11px;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 0;
      background: white;
    }

    select {
      flex: 1;
    }

    button {
      background: #ffc400;
      border: none;
      color: #222;
      font-weight: bold;
      cursor: pointer;
    }

    .chart-title {
      background: #3b3b3b;
      color: white;
      padding: 12px 8px;
      text-align: center;
      font-size: 20px;
      line-height: 1.4;
    }

    .table-wrap {
      overflow-x: auto;
      background: white;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 570px;
      background: white;
    }

    th {
      background: #3b3b3b;
      color: white;
      font-weight: normal;
      padding: 11px 8px;
      border: 1px solid #555;
    }

    td {
      padding: 10px 8px;
      border: 1px solid #ddd;
      text-align: center;
      font-size: 16px;
    }

    td:first-child {
      font-weight: bold;
      background: #f8f8f8;
    }

    .note {
      margin-top: 16px;
      padding: 12px;
      background: white;
      border: 1px solid #ddd;
      color: #555;
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 420px) {
      .filters {
        gap: 6px;
      }

      select, button {
        padding: 10px 7px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Monthly Record Chart</h1>
    <p>Historical Results Chart</p>
  </header>

  <main class="container">
    <a class="back" href="index.html">← Back to Results</a>

    <div class="filters">
      <select id="month" aria-label="Select month">
        <option value="0">January</option>
        <option value="1">February</option>
        <option value="2">March</option>
        <option value="3">April</option>
        <option value="4">May</option>
        <option value="5">June</option>
        <option value="6">July</option>
        <option value="7">August</option>
        <option value="8" selected>September</option>
        <option value="9">October</option>
        <option value="10">November</option>
        <option value="11">December</option>
      </select>

      <select id="year" aria-label="Select year">
        <option>2024</option>
        <option>2025</option>
        <option selected>2026</option>
        <option>2027</option>
      </select>

      <button id="showChart" type="button">Show</button>
    </div>

    <div class="chart-title" id="chartTitle">
      September 2026 Monthly Chart
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Desawar</th>
            <th>Shri Ganesh</th>
            <th>Faridabad</th>
            <th>Ghaziabad</th>
          </tr>
        </thead>
        <tbody id="chartBody"></tbody>
      </table>
    </div>

    <div class="note">
      <strong>Note:</strong> This is a demonstration chart.
      The table does not contain verified historical results.
      Replace the blank values with data you are authorized
      to publish.
    </div>
  </main>

  <script>
    const monthSelect = document.getElementById("month");
    const yearSelect = document.getElementById("year");
    const chartBody = document.getElementById("chartBody");
    const chartTitle = document.getElementById("chartTitle");

    const monthNames = [
      "January", "February", "March", "April",
      "May", "June", "July", "August",
      "September", "October", "November", "December"
    ];

    function renderChart() {
      const month = Number(monthSelect.value);
      const year = Number(yearSelect.value);
      const days = new Date(year, month + 1, 0).getDate();

      chartTitle.textContent =
        monthNames[month] + " " + year + " Monthly Chart";

      chartBody.innerHTML = "";

      for (let day = 1; day <= days; day++) {
        const row = document.createElement("tr");

        const values = [
          String(day).padStart(2, "0"),
          "--",
          "--",
          "--",
          "--"
        ];

        values.forEach(function(value) {
          const cell = document.createElement("td");
          cell.textContent = value;
          row.appendChild(cell);
        });

        chartBody.appendChild(row);
      }
    }

    document.getElementById("showChart").addEventListener(
      "click",
      renderChart
    );

    renderChart();
  </script>
</body>
</html>
