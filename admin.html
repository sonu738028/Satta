
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f1f1;
      color: #222;
    }

    header {
      background: #303030;
      color: white;
      text-align: center;
      padding: 20px 12px;
    }

    header h1 { margin: 0 0 6px; }

    main {
      max-width: 650px;
      margin: 20px auto;
      padding: 0 12px 35px;
    }

    .card {
      background: white;
      border: 1px solid #ddd;
      padding: 18px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
      font-size: 14px;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 8px;
    }

    input, select {
      border: 1px solid #bbb;
      background: white;
    }

    button {
      border: 0;
      background: #30c69a;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button.danger { background: #d94848; }
    button.secondary { background: #444; }

    .hidden { display: none; }

    .message {
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .entry {
      border-bottom: 1px solid #ddd;
      padding: 12px 0;
    }

    .entry strong { display: block; margin-bottom: 5px; }
    .entry small { color: #666; }

    .back {
      display: inline-block;
      margin-bottom: 14px;
      color: #456fb5;
      text-decoration: none;
    }
  </style>
</head>

<body>
<header>
  <h1>Admin Dashboard</h1>
  <p>Firebase Result Manager</p>
</header>

<main>
  <a class="back" href="index.html">← Main Website</a>

  <section class="card" id="loginPanel">
    <h2>Admin Login</h2>

    <form id="loginForm">
      <label for="email">Admin Email</label>
      <input id="email" type="email" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" type="password"
        autocomplete="current-password" required>

      <button type="submit">Login</button>
    </form>

    <p class="message" id="loginMessage" role="status"></p>
  </section>

  <section class="card hidden" id="dashboard">
    <h2>Add Published Result</h2>

    <form id="resultForm">
      <label for="market">Market</label>
      <select id="market" required>
        <option>DESAWAR</option>
        <option>SHRI GANESH</option>
        <option>FARIDABAD</option>
        <option>GHAZIABAD</option>
      </select>

      <label for="date">Result Date</label>
      <input id="date" type="date" required>

      <label for="result">Result Number</label>
      <input id="result" type="text"
        inputmode="numeric" pattern="[0-9]{1,3}"
        maxlength="3" required>

      <button type="submit">Save to Firebase</button>
    </form>

    <p class="message" id="saveMessage" role="status"></p>

    <h2>Saved Results</h2>
    <div id="resultsList">Loading results...</div>

    <button type="button" class="secondary" id="logoutButton">
      Logout
    </button>
  </section>
</main>

<script type="module">
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBzbbDq388GcoGyFVE-EmZk3flKgT13tZw",
    authDomain: "satta-result-4a7a5.firebaseapp.com",
    projectId: "satta-result-4a7a5",
    storageBucket: "satta-result-4a7a5.firebasestorage.app",
    messagingSenderId: "264282820868",
    appId: "1:264282820868:web:c39a794e65c5be0e7c0051"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const loginPanel = document.getElementById("loginPanel");
  const dashboard = document.getElementById("dashboard");
  const loginMessage = document.getElementById("loginMessage");
  const saveMessage = document.getElementById("saveMessage");
  const resultsList = document.getElementById("resultsList");

  document.getElementById("date").value =
    new Date().toISOString().slice(0, 10);

  document.getElementById("loginForm").addEventListener(
    "submit", async (event) => {
      event.preventDefault();
      loginMessage.textContent = "Signing in...";

      try {
        await signInWithEmailAndPassword(
          auth,
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
        loginMessage.textContent = "";
      } catch (error) {
        loginMessage.textContent =
          "Login failed. Check your email, password and Firebase settings.";
      }
    }
  );

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      loginPanel.classList.add("hidden");
      dashboard.classList.remove("hidden");
      await loadResults();
    } else {
      dashboard.classList.add("hidden");
      loginPanel.classList.remove("hidden");
      resultsList.textContent = "";
    }
  });

  document.getElementById("resultForm").addEventListener(
    "submit", async (event) => {
      event.preventDefault();

      const user = auth.currentUser;
      if (!user) return;

      const result = document.getElementById("result").value.trim();

      if (!/^[0-9]{1,3}$/.test(result)) {
        saveMessage.textContent = "Enter a valid result number.";
        return;
      }

      saveMessage.textContent = "Saving...";

      try {
        await addDoc(collection(db, "results"), {
          market: document.getElementById("market").value,
          date: document.getElementById("date").value,
          result: result,
          createdAt: new Date().toISOString()
        });

        saveMessage.textContent = "Result saved successfully.";
        document.getElementById("result").value = "";
        await loadResults();
      } catch (error) {
        saveMessage.textContent =
          "Could not save. Verify your Admin UID and Firestore Rules.";
      }
    }
  );

  async function loadResults() {
    resultsList.textContent = "Loading...";

    try {
      const q = query(
        collection(db, "results"),
        orderBy("date", "desc")
      );

      const snapshot = await getDocs(q);
      resultsList.replaceChildren();

      if (snapshot.empty) {
        resultsList.textContent = "No results saved yet.";
        return;
      }

      snapshot.forEach((item) => {
        const data = item.data();
        const row = document.createElement("div");
        row.className = "entry";

        const title = document.createElement("strong");
        title.textContent = data.market + " — " + data.result;

        const date = document.createElement("small");
        date.textContent = data.date;

        const remove = document.createElement("button");
        remove.className = "danger";
        remove.textContent = "Delete";
        remove.type = "button";

        remove.addEventListener("click", async () => {
          if (!auth.currentUser) return;
          if (!confirm("Delete this result?")) return;

          try {
            await deleteDoc(doc(db, "results", item.id));
            await loadResults();
          } catch (error) {
            alert("Delete failed. Check permissions.");
          }
        });

        row.append(title, date, remove);
        resultsList.appendChild(row);
      });
    } catch (error) {
      resultsList.textContent =
        "Could not load results. Check Firestore Rules and connection.";
    }
  }

  document.getElementById("logoutButton").addEventListener(
    "click", async () => {
      await signOut(auth);
    }
  );
</script>
</body>
</html>
