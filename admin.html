<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1f1f1">
  <title>Admin Dashboard</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f1f1;
      color: #222;
    }

    header {
      background: #303030;
      color: white;
      text-align: center;
      padding: 20px 12px;
    }

    header h1 { margin: 0 0 6px; }

    main {
      max-width: 650px;
      margin: 20px auto;
      padding: 0 12px 35px;
    }

    .card {
      background: white;
      border: 1px solid #ddd;
      padding: 18px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
      font-size: 14px;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 8px;
    }

    input, select {
      border: 1px solid #bbb;
      background: white;
    }

    button {
      border: 0;
      background: #30c69a;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; cursor: wait; }
    button.danger { background: #d94848; }
    button.secondary { background: #444; }

    .hidden { display: none; }

    .message {
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .entry {
      border-bottom: 1px solid #ddd;
      padding: 12px 0;
    }

    .entry strong { display: block; margin-bottom: 5px; }
    .entry small { color: #666; }

    .back {
      display: inline-block;
      margin-bottom: 14px;
      color: #456fb5;
      text-decoration: none;
    }
  </style>
</head>

<body>
<header>
  <h1>Admin Dashboard</h1>
  <p>Firebase Result Manager</p>
</header>

<main>
  <a class="back" href="index.html">← Main Website</a>

  <section class="card" id="loginPanel">
    <h2>Admin Login</h2>

    <form id="loginForm">
      <label for="email">Admin Email</label>
      <input id="email" type="email"
        autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" type="password"
        autocomplete="current-password" required>

      <button id="loginButton" type="submit">Login</button>
    </form>

    <p class="message" id="loginMessage" role="status"></p>
  </section>

  <section class="card hidden" id="dashboard">
    <h2>Add Published Result</h2>

    <form id="resultForm">
      <label for="market">Market</label>
      <select id="market" required>
        <option value="DESAWAR">DESAWAR</option>
        <option value="SHRI GANESH">SHRI GANESH</option>
        <option value="FARIDABAD">FARIDABAD</option>
        <option value="GHAZIABAD">GHAZIABAD</option>
      </select>

      <label for="date">Result Date</label>
      <input id="date" type="date" required>

      <label for="result">Result Number</label>
      <input id="result" type="text"
        inputmode="numeric"
        pattern="[0-9]{1,3}"
        maxlength="3"
        placeholder="Enter result"
        required>

      <button id="saveButton" type="submit">
        Save to Firebase
      </button>
    </form>

    <p class="message" id="saveMessage" role="status"></p>

    <h2>Saved Results</h2>
    <div id="resultsList">Loading results...</div>

    <button type="button" class="secondary" id="logoutButton">
      Logout
    </button>
  </section>
</main>

<script type="module">
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    query,
    orderBy,
    where,
    limit
  } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBzbbDq388GcoGyFVE-EmZk3flKgT13tZw",
    authDomain: "satta-result-4a7a5.firebaseapp.com",
    projectId: "satta-result-4a7a5",
    storageBucket: "satta-result-4a7a5.firebasestorage.app",
    messagingSenderId: "264282820868",
    appId: "1:264282820868:web:c39a794e65c5be0e7c0051"
  };

  // Replace this with the SAME UID used in your Firestore Rules.
  const ADMIN_UID = "Kt6KdqqXBhRMtJBt33IGFjltc0C3";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const loginPanel = document.getElementById("loginPanel");
  const dashboard = document.getElementById("dashboard");
  const loginMessage = document.getElementById("loginMessage");
  const saveMessage = document.getElementById("saveMessage");
  const resultsList = document.getElementById("resultsList");
  const loginButton = document.getElementById("loginButton");
  const saveButton = document.getElementById("saveButton");

  // Local date, without UTC date shifting.
  function getLocalDate() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
  }

  document.getElementById("date").value = getLocalDate();

  function isAdmin(user) {
    return Boolean(
      user &&
      ADMIN_UID !== "Kt6KdqqXBhRMtJBt33IGFjltc0C3" &&
      user.uid === ADMIN_UID
    );
  }

  document.getElementById("loginForm").addEventListener(
    "submit", async (event) => {
      event.preventDefault();
      loginButton.disabled = true;
      loginMessage.textContent = "Signing in...";

      try {
        const credential = await signInWithEmailAndPassword(
          auth,
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );

        if (!isAdmin(credential.user)) {
          await signOut(auth);
          loginMessage.textContent =
            "Access denied. This account is not the configured Admin.";
        } else {
          loginMessage.textContent = "";
        }
      } catch (error) {
        console.error("Login error:", error);
        loginMessage.textContent =
          "Login failed. Check your credentials and Firebase Authentication settings.";
      } finally {
        loginButton.disabled = false;
      }
    }
  );

  onAuthStateChanged(auth, async (user) => {
    if (user && isAdmin(user)) {
      loginPanel.classList.add("hidden");
      dashboard.classList.remove("hidden");
      await loadResults();
    } else {
      dashboard.classList.add("hidden");
      loginPanel.classList.remove("hidden");
      resultsList.textContent = "";
    }
  });

  document.getElementById("resultForm").addEventListener(
    "submit", async (event) => {
      event.preventDefault();

      const user = auth.currentUser;

      if (!isAdmin(user)) {
        saveMessage.textContent = "Admin access required.";
        return;
      }

      const market = document.getElementById("market").value;
      const date = document.getElementById("date").value;
      const result = document.getElementById("result").value.trim();

      if (!date || !/^[0-9]{1,3}$/.test(result)) {
        saveMessage.textContent =
          "Enter a valid date and a result containing 1 to 3 digits.";
        return;
      }

      saveButton.disabled = true;
      saveMessage.textContent = "Saving...";

      try {
        const resultsRef = collection(db, "results");

        // Find an existing record for this market and date.
        const existingQuery = query(
          resultsRef,
          where("market", "==", market),
          where("date", "==", date),
          limit(1)
        );

        const existing = await getDocs(existingQuery);

        const record = {
          market,
          date,
          result,
          createdAt: new Date().toISOString(),
          updatedBy: user.uid
        };

        if (existing.empty) {
          await addDoc(resultsRef, record);
          saveMessage.textContent = "Result saved successfully.";
        } else {
          // Update the existing record instead of adding a duplicate.
          const existingDoc = existing.docs[0];
          const { setDoc } = await import(
            "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js"
          );

          await setDoc(doc(db, "results", existingDoc.id), record);
          saveMessage.textContent =
            "This market's result for that date has been updated.";
        }

        document.getElementById("result").value = "";
        await loadResults();
      } catch (error) {
        console.error("Save error:", error);
        saveMessage.textContent =
          "Save failed. Check your Admin UID, Firestore Rules and internet connection.";
      } finally {
        saveButton.disabled = false;
      }
    }
  );

  async function loadResults() {
    if (!isAdmin(auth.currentUser)) return;

    resultsList.textContent = "Loading results...";

    try {
      const q = query(
        collection(db, "results"),
        orderBy("date", "desc")
      );

      const snapshot = await getDocs(q);
      resultsList.replaceChildren();

      if (snapshot.empty) {
        resultsList.textContent = "No results saved yet.";
        return;
      }

      snapshot.forEach((item) => {
        const data = item.data();
        const row = document.createElement("div");
        row.className = "entry";

        const title = document.createElement("strong");
        title.textContent =
          `${data.market || "Unknown market"} — ${data.result ?? "--"}`;

        const date = document.createElement("small");
        date.textContent = data.date || "No date";

        const remove = document.createElement("button");
        remove.className = "danger";
        remove.textContent = "Delete";
        remove.type = "button";

        remove.addEventListener("click", async () => {
          if (!isAdmin(auth.currentUser)) {
            alert("Admin access required.");
            return;
          }

          if (!confirm("Delete this result permanently?")) return;

          remove.disabled = true;

          try {
            await deleteDoc(doc(db, "results", item.id));
            saveMessage.textContent = "Result deleted.";
            await loadResults();
          } catch (error) {
            console.error("Delete error:", error);
            alert("Delete failed. Check your Firestore Rules.");
            remove.disabled = false;
          }
        });

        row.append(title, date, remove);
        resultsList.appendChild(row);
      });
    } catch (error) {
      console.error("Load error:", error);
      resultsList.textContent =
        "Could not load results. Check Firestore Rules and connection.";
    }
  }

  document.getElementById("logoutButton").addEventListener(
    "click", async () => {
      await signOut(auth);
    }
  );
</script>
</body>
</html>
